<script>
function masquerSousElementsLegende() {
    document.querySelectorAll('.layer-switcher label').forEach(function(label) {
        const br = label.querySelector('br');

        if (br) {
            let element = br;

            while (element) {
                const suivant = element.nextSibling;
                element.remove();
                element = suivant;
            }
        }

        label.querySelectorAll('img, table, canvas, svg').forEach(function(element) {
            element.remove();
        });
    });
}

masquerSousElementsLegende();

const observateurLegende = new MutationObserver(function() {
    masquerSousElementsLegende();
});

const panneauLegende = document.querySelector('.layer-switcher');

if (panneauLegende) {
    observateurLegende.observe(panneauLegende, {
        childList: true,
        subtree: true
    });
}
</script>
